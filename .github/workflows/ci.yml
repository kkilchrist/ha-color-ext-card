name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Build (release / minified)
        run: npm run build:release

      - name: Verify committed dist/ matches source
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/input-color-card.js is out of date. Run 'npm run build:release' locally and commit the result."
            exit 1
          fi
